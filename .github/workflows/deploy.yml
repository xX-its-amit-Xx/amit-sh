name: Redirect GitHub Pages to Vercel

# The live site moved to Vercel (https://amit-sh.vercel.app), which builds every
# push: `main` → production, other branches → preview URLs. This workflow keeps
# the old https://xx-its-amit-xx.github.io/amit-sh/ links working by publishing a
# tiny page that forwards visitors (and any path) to the new home.

on:
  push:
    branches: [main]
    paths: [".github/workflows/deploy.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Build redirect page
        run: |
          mkdir -p out
          cat > out/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <title>amit.sh has moved</title>
            <link rel="canonical" href="https://amit-sh.vercel.app/" />
            <meta http-equiv="refresh" content="0; url=https://amit-sh.vercel.app/" />
            <script>
              var rest = location.pathname.replace(/^\/amit-sh/, "") + location.search + location.hash;
              location.replace("https://amit-sh.vercel.app" + rest);
            </script>
          </head>
          <body style="font-family: monospace; background: #1E1C19; color: #F5E6D3; padding: 40px">
            amit.sh has moved → <a style="color: #E0A970" href="https://amit-sh.vercel.app/">amit-sh.vercel.app</a>
          </body>
          </html>
          HTML
          cp out/index.html out/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deployment
        uses: actions/deploy-pages@v4
