name = "amit-sh-chat"
main = "chat.js"
compatibility_date = "2024-11-01"

[vars]
# Comma-separated list of sites allowed to call the chatbot.
ALLOWED_ORIGIN = "https://xX-its-amit-Xx.github.io,https://xx-its-amit-xx.github.io"
# Any chat model your Groq account offers (see console.groq.com/docs/models).
GROQ_MODEL = "llama-3.3-70b-versatile"

# Secret (set with `wrangler secret put GROQ_API_KEY -c chat.wrangler.toml`,
# never commit it):
#   GROQ_API_KEY

# Optional per-IP rate limiting (30 msgs/hour): create a KV namespace and uncomment:
# [[kv_namespaces]]
# binding = "RL"
# id = "<your-kv-namespace-id>"
